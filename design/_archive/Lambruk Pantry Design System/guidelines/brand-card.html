<!-- @dsCard group="Brand" viewport="700x230" name="Card anatomy" subtitle="White surface, 1px gold-200 hairline, 16px radius, whisper shadow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);background:var(--paper);color:var(--text-body);padding:20px}</style></head><body>
<div style="display:flex;gap:20px;align-items:stretch">
<div style="width:280px;background:var(--surface-card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-whisper);overflow:hidden">
<img src="../assets/images/product-honey.png" style="width:100%;height:110px;object-fit:cover;display:block">
<div style="padding:18px"><div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-accent)">Honey</div>
<div style="font-family:var(--font-serif-display);font-size:24px;color:var(--text-strong);margin-top:4px">Raw Blue Gum Honey</div>
<div style="font-size:15px;color:var(--text-body);margin-top:12px">$22.00</div></div></div>
<ul style="margin:0;padding-left:18px;font-size:13px;line-height:2;color:var(--text-muted);align-self:center">
<li>Surface <code style="font-family:var(--font-mono)">--surface-card</code></li>
<li>Hairline <code style="font-family:var(--font-mono)">1px --border</code></li>
<li>Radius <code style="font-family:var(--font-mono)">--radius-lg</code></li>
<li>Rest shadow <code style="font-family:var(--font-mono)">--shadow-whisper</code>, hover <code style="font-family:var(--font-mono)">--shadow-card</code> + 2px lift</li>
<li>Image scales to 1.03 inside the clip on hover</li>
</ul></div></body></html>
