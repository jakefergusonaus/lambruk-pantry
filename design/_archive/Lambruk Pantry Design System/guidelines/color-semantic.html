<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);background:var(--paper);color:var(--text-body);padding:20px}</style></head><body>
<div style="display:flex;gap:14px">
<div style="flex:1;min-width:0"><div style="height:56px;background:var(--brand);border:1px solid var(--border);border-radius:var(--radius-sm)"></div><div style="font-size:11px;margin-top:7px;color:var(--text-strong);font-weight:500">Brand</div><div style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">--brand</div></div><div style="flex:1;min-width:0"><div style="height:56px;background:var(--brand-deep);border:1px solid var(--border);border-radius:var(--radius-sm)"></div><div style="font-size:11px;margin-top:7px;color:var(--text-strong);font-weight:500">Brand deep</div><div style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">--brand-deep</div></div><div style="flex:1;min-width:0"><div style="height:56px;background:var(--accent);border:1px solid var(--border);border-radius:var(--radius-sm)"></div><div style="font-size:11px;margin-top:7px;color:var(--text-strong);font-weight:500">Accent</div><div style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">--accent</div></div><div style="flex:1;min-width:0"><div style="height:56px;background:var(--text-body);border:1px solid var(--border);border-radius:var(--radius-sm)"></div><div style="font-size:11px;margin-top:7px;color:var(--text-strong);font-weight:500">Text body</div><div style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">--text-body</div></div><div style="flex:1;min-width:0"><div style="height:56px;background:var(--text-muted);border:1px solid var(--border);border-radius:var(--radius-sm)"></div><div style="font-size:11px;margin-top:7px;color:var(--text-strong);font-weight:500">Text muted</div><div style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">--text-muted</div></div><div style="flex:1;min-width:0"><div style="height:56px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-sm)"></div><div style="font-size:11px;margin-top:7px;color:var(--text-strong);font-weight:500">Border</div><div style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">--border</div></div><div style="flex:1;min-width:0"><div style="height:56px;background:var(--focus-ring);border:1px solid var(--border);border-radius:var(--radius-sm)"></div><div style="font-size:11px;margin-top:7px;color:var(--text-strong);font-weight:500">Focus ring</div><div style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">--focus-ring</div></div>
</div></body></html>
